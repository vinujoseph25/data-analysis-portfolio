name: Black Friday Tests

on:
  push:
    paths:
      - "projects/black-friday-sales-prediction/**"
      - ".github/workflows/black-friday-tests.yml"
  pull_request:
    paths:
      - "projects/black-friday-sales-prediction/**"
      - ".github/workflows/black-friday-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: projects/black-friday-sales-prediction

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/black-friday-sales-prediction/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: pytest -q tests --cov=src --cov-report=term-missing
